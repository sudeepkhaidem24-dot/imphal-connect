<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Pulse — visual social network">
<title>Pulse</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#111;--muted:#737373;--line:#e7e7e7;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.top{height:60px;position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topin{height:100%;max-width:1060px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:-1.8px}.brand span{background:linear-gradient(90deg,#111,#7c3aed,#ec4899);color:transparent;background-clip:text}
.icons{display:flex;gap:4px}.icon{width:40px;height:40px;border-radius:50%;font-size:21px}.icon:hover{background:#f2f2f2}
.layout{max-width:1060px;margin:auto;padding:24px 16px 90px;display:grid;grid-template-columns:minmax(0,650px) 290px;gap:36px}
.stories{display:flex;gap:14px;overflow:auto;padding:4px 0 18px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{min-width:65px;text-align:center}
.avatar{width:62px;height:62px;padding:2px;border-radius:50%;background:conic-gradient(#f59e0b,#ec4899,#8b5cf6,#f59e0b)}.avatar>div{height:100%;width:100%;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#ddd}.avatar img,.mini img{width:100%;height:100%;object-fit:cover}.story small{display:block;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px}.head{height:58px;padding:0 14px;display:flex;align-items:center;gap:10px}.mini{width:35px;height:35px;border-radius:50%;overflow:hidden;background:#ddd;flex:none}.who{font-size:13px;font-weight:800;flex:1}.where{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.media{aspect-ratio:1;background:linear-gradient(135deg,#ddd,#eee);position:relative}.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}.fallback{display:none;position:absolute;inset:0;place-items:center;background:linear-gradient(135deg,#111827,#7c3aed,#ec4899);color:#fff;font-size:65px}.bad .fallback{display:grid}
.body{padding:11px 14px 14px}.actions{display:flex;gap:2px}.actions button{font-size:25px;width:38px;height:38px}.actions .save{margin-left:auto}.likes{font-size:13px;font-weight:800;margin-top:2px}.caption{font-size:14px;line-height:1.45;margin-top:6px}.caption b{margin-right:5px}.time{font-size:10px;color:#999;margin-top:8px;text-transform:uppercase}
.side{position:sticky;top:84px;height:max-content}.me{display:flex;align-items:center;gap:11px;margin-bottom:25px}.me .avatar{width:50px;height:50px}.meinfo{flex:1}.meinfo b{display:block;font-size:13px}.meinfo span{color:var(--muted);font-size:12px}.link{font-size:12px;font-weight:800;color:#6d28d9}.suggest h4{color:var(--muted);font-size:13px}.srow{display:flex;align-items:center;gap:9px;margin:13px 0}.srow .mini{width:38px;height:38px}.srow div:nth-child(2){flex:1}.srow b{display:block;font-size:12px}.srow span{font-size:11px;color:var(--muted)}
.bottom{display:none}.empty{text-align:center;padding:45px 18px;color:var(--muted);line-height:1.6}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.sheet{width:min(460px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0008}.close{float:right;font-size:22px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafafa;margin:6px 0;outline:none}.field:focus{border-color:#b8a3ff;background:#fff}.primary,.secondary{width:100%;padding:12px;border-radius:12px;font-weight:800;margin-top:7px}.primary{background:#111;color:#fff}.secondary{background:#f1f1f1}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#ede9fe,transparent 30%),radial-gradient(circle at 90% 90%,#fce7f3,transparent 30%),#fafafa}.authcard{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 20px 60px #0000000d}.sub{text-align:center;color:var(--muted);font-size:13px}.tabs{display:flex;gap:4px;background:#f3f3f3;border-radius:12px;padding:4px;margin:18px 0 10px}.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:800}.tabs .active{background:#fff}.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;z-index:200;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.layout{display:block;padding:12px 10px 85px}.side{display:none}.media{aspect-ratio:4/5}.post{border-radius:14px}.bottom{position:fixed;display:flex;z-index:40;bottom:0;left:0;right:0;height:64px;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around}.bottom button{width:20%;font-size:22px}.bottom small{display:block;font-size:9px;margin-top:-2px}.desktop{display:none!important}}
</style></head>
<body><div id="root"><main class="auth"><section class="authcard"><div class="brand" style="text-align:center"><span>Pulse</span></div><p class="sub">Loading Pulse…</p></section></main></div><div id="toast" class="toast"></div>
<script>
var URL="https://pegnhmskwmyatjjoixvj.supabase.co",KEY="sb_publishable_AoplDRTd_SjB8KR6MLuzPg_5_bZ6i2Z";
var sb=null,user=null,profile=null;
var imgs=["https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=85"];
function $(s){return document.querySelector(s)}function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function avatar(url,name){if(url)return esc(url);var n=(name||"U").charAt(0).toUpperCase();return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g'><stop stop-color='#c4b5fd'/><stop offset='1' stop-color='#f9a8d4'/></linearGradient></defs><circle cx='50' cy='50' r='50' fill='url(#g)'/><text x='50' y='64' text-anchor='middle' font-size='42' font-family='Arial' fill='white'>"+n+"</text></svg>")}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},2200)}
function renderAuth(){
$("#root").innerHTML="<main class='auth'><section class='authcard'><div class='brand' style='text-align:center'><span>Pulse</span></div><p class='sub'>Share what moves you.</p><div class='tabs'><button id='lt' class='active'>Log in</button><button id='st'>Create account</button></div><input id='email' class='field' type='email' placeholder='Email address'><input id='pass' class='field' type='password' placeholder='Password'><input id='name' class='field' style='display:none' placeholder='Display name'><button id='ab' class='primary'>Log in</button><p id='am' class='sub'></p></section></main>";
var mode="login";$("#lt").onclick=function(){mode="login";$("#lt").classList.add("active");$("#st").classList.remove("active");$("#name").style.display="none";$("#ab").textContent="Log in"};$("#st").onclick=function(){mode="signup";$("#st").classList.add("active");$("#lt").classList.remove("active");$("#name").style.display="block";$("#ab").textContent="Create account"};
$("#ab").onclick=async function(){var email=$("#email").value.trim(),pass=$("#pass").value,name=$("#name").value.trim();if(!email||pass.length<6){$("#am").textContent="Use a valid email and a 6+ character password.";return}$("#ab").disabled=true;var r=mode==="login"?await sb.auth.signInWithPassword({email:email,password:pass}):await sb.auth.signUp({email:email,password:pass,options:{data:{name:name}}});$("#ab").disabled=false;if(r.error)$("#am").textContent=r.error.message;else if(mode==="signup"&&!r.data.session)$("#am").textContent="Check your email to confirm your account."};
}
async function ensureProfile(){var r=await sb.from("social_profiles").select("*").eq("id",user.id).maybeSingle();if(!r.data){var base=(user.email||"user").split("@")[0].replace(/[^A-Za-z0-9_.]/g,"").slice(0,20)||"user",u=base,i=1;while((await sb.from("social_profiles").select("id").eq("username",u).maybeSingle()).data)u=base+(i++);r=await sb.from("social_profiles").insert({id:user.id,username:u,display_name:user.user_metadata&&user.user_metadata.name||u}).select().single()}profile=r.data}
function renderApp(){document.querySelector("#root").innerHTML="<div><header class='top'><div class='topin'><button class='brand' onclick='home()'><span>Pulse</span></button><div class='icons'><button class='icon desktop' onclick='search()'>⌕</button><button class='icon' onclick='create()'>＋</button><button class='icon desktop' onclick='messages()'>♡</button><button class='icon' onclick='profile()'>◯</button><button class='icon' onclick='logout()'>◎</button></div></div></header><main class='layout'><section id='main'></section><aside id='side' class='side'></aside></main><nav class='bottom'><button onclick='home()'>⌂<small>Home</small></button><button onclick='search()'>⌕<small>Search</small></button><button onclick='create()'>＋<small>Create</small></button><button onclick='messages()'>♡<small>Activity</small></button><button onclick='profilePage()'>◯<small>Profile</small></button></nav></div>"}
function side(){if(!$("#side"))return;$("#side").innerHTML="<div class='me'><div class='avatar'><div><img src='"+avatar(profile.avatar_url,profile.username)+"'></div></div><div class='meinfo'><b>"+esc(profile.username)+"</b><span>"+esc(profile.display_name)+"</span></div><button class='link' onclick='profilePage()'>Profile</button></div><div class='suggest'><h4>Suggested for you</h4><div class='srow'><div class='mini'><img src='"+imgs[1]+"'></div><div><b>explore</b><span>New on Pulse</span></div><button class='link' onclick='search()'>Follow</button></div><div class='srow'><div class='mini'><img src='"+imgs[2]+"'></div><div><b>creative</b><span>Suggested</span></div><button class='link' onclick='search()'>Follow</button></div></div>"}
async function home(){renderApp();$("#main").innerHTML="<div class='stories' id='stories'></div><div id='feed'><div class='empty'>Loading your feed…</div></div>";side();await stories();await feed()}
async function stories(){var r=await sb.from("social_stories").select("*,social_profiles(username,display_name,avatar_url)").gt("expires_at",new Date().toISOString()).order("created_at",{ascending:false}).limit(20),a=[profile].concat((r.data||[]).map(function(x){return x.social_profiles}));$("#stories").innerHTML=a.map(function(x,i){return "<button class='story' onclick='"+(i?"toast(\"Story viewer coming next\")":"create()")+"'><div class='avatar'><div><img src='"+avatar(x.avatar_url,x.username)+"'></div></div><small>"+esc(x.display_name||x.username)+"</small></button>"}).join("")}
async function feed(){var r=await sb.from("social_posts").select("*,social_profiles(username,display_name,avatar_url),social_likes(user_id),social_comments(id)").order("created_at",{ascending:false}).limit(30);if(r.error){$("#feed").innerHTML="<div class='empty'>Feed error. Refresh and try again.</div>";return}if(!r.data.length){$("#feed").innerHTML="<div class='empty'><b>Your feed is empty.</b><br>Create your first post.</div>";return}$("#feed").innerHTML=r.data.map(post).join("")}
function post(p){var liked=(p.social_likes||[]).some(function(x){return x.user_id===user.id}),likes=(p.social_likes||[]).length,media=p.media_type==="video"?"<video controls playsinline preload='metadata' src='"+esc(p.media_url)+"'></video>":"<img src='"+esc(p.media_url)+"' onerror='this.closest(\".media\").classList.add(\"bad\")' alt=''>";
return "<article class='post'><div class='head'><div class='mini'><img src='"+avatar(p.social_profiles&&p.social_profiles.avatar_url,p.social_profiles&&p.social_profiles.username)+"'></div><div class='who'>"+esc(p.social_profiles&&p.social_profiles.username||"user")+"<span class='where'>"+esc(p.location||"")+"</span></div><button>···</button></div><div class='media'>"+media+"<div class='fallback'>✦</div></div><div class='body'><div class='actions'><button onclick='like(\""+p.id+"\","+liked+")'>"+(liked?"♥":"♡")+"</button><button onclick='comment(\""+p.id+"\")'>◯</button><button onclick='share(\""+p.id+"\")'>⌁</button><button class='save' onclick='save(\""+p.id+"\")'>▱</button></div><div class='likes'>"+likes+" like"+(likes===1?"":"s")+"</div>"+(p.caption?"<div class='caption'><b>"+esc(p.social_profiles&&p.social_profiles.username||"user")+"</b>"+esc(p.caption)+"</div>":"")+"<div class='time'>"+new Date(p.created_at).toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+(p.social_comments||[]).length+" comments</div></div></article>"}
async function like(id,on){if(on)await sb.from("social_likes").delete().match({post_id:id,user_id:user.id});else await sb.from("social_likes").insert({post_id:id,user_id:user.id});await feed()}
async function comment(id){var b=prompt("Write a comment");if(!b||!b.trim())return;var r=await sb.from("social_comments").insert({post_id:id,user_id:user.id,body:b.trim()});if(r.error)toast(r.error.message);else{toast("Comment added");feed()}}
async function save(id){var r=await sb.from("social_saves").select("post_id").match({post_id:id,user_id:user.id}).maybeSingle();if(r.data)await sb.from("social_saves").delete().match({post_id:id,user_id:user.id});else await sb.from("social_saves").insert({post_id:id,user_id:user.id});toast(r.data?"Removed":"Saved")}
async function share(id){var u=location.href+"#post-"+id;if(navigator.share)navigator.share({title:"Pulse post",url:u});else{try{await navigator.clipboard.writeText(u);toast("Link copied")}catch(e){toast("Share link: "+u)}}}
function modal(html){var m=document.createElement("div");m.className="modal show";m.innerHTML="<div class='sheet'>"+html+"</div>";document.body.appendChild(m);return m}
function search(){var m=modal("<button class='close' onclick='this.closest(\".modal\").remove()'>×</button><h2>Search</h2><input id='sq' class='field' placeholder='Search username'><div id='sr' class='empty'>Type at least 2 characters.</div>");$("#sq").oninput=async function(){var q=this.value.trim();if(q.length<2){$("#sr").textContent="Type at least 2 characters.";return}var r=await sb.from("social_profiles").select("*").ilike("username","%"+q+"%").limit(12);$("#sr").innerHTML=(r.data||[]).map(function(x){return "<div style='display:flex;align-items:center;gap:10px;padding:8px 0'><div class='mini'><img src='"+avatar(x.avatar_url,x.username)+"'></div><div style='flex:1;text-align:left'><b>"+esc(x.username)+"</b><div style='font-size:11px;color:#777'>"+esc(x.display_name)+"</div></div><button class='link' onclick='toast(\"Profile found\")'>View</button></div>"}).join("")||"No users found."}}
function create(){var m=modal("<button class='close' onclick='this.closest(\".modal\").remove()'>×</button><h2>Create</h2><input id='file' class='field' type='file' accept='image/*,video/*'><input id='cap' class='field' placeholder='Write a caption…'><input id='loc' class='field' placeholder='Add location'><button class='primary' id='pub'>Publish post</button><p id='msg' class='sub'></p>");$("#pub").onclick=async function(){var f=$("#file").files[0];if(!f){$("#msg").textContent="Choose a photo or video.";return}this.disabled=true;$("#msg").textContent="Uploading…";var ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=user.id+"/"+crypto.randomUUID()+"."+ext,u=await sb.storage.from("social-media").upload(path,f,{contentType:f.type,upsert:false});if(u.error){this.disabled=false;$("#msg").textContent=u.error.message;return}var p=sb.storage.from("social-media").getPublicUrl(path).data.publicUrl,r=await sb.from("social_posts").insert({user_id:user.id,media_url:p,media_type:f.type.indexOf("video")===0?"video":"image",caption:$("#cap").value.trim(),location:$("#loc").value.trim()||null});if(r.error)$("#msg").textContent=r.error.message;else{m.remove();toast("Post published");home()}}}
async function messages(){renderApp();$("#main").innerHTML="<section><h2>Messages</h2><div class='empty'>Messaging infrastructure is live. Search for a user to start building your inbox.</div><button class='primary' onclick='search()'>Find people</button></section>";side()}
async function profilePage(){renderApp();var r=await sb.from("social_posts").select("*,social_likes(user_id)").eq("user_id",user.id).order("created_at",{ascending:false});$("#main").innerHTML="<section><div style='display:flex;gap:18px;align-items:center;padding:8px 0 20px'><div class='avatar' style='width:82px;height:82px'><div><img src='"+avatar(profile.avatar_url,profile.username)+"'></div></div><div><h2 style='margin:0'>"+esc(profile.username)+"</h2><div style='font-size:13px;margin-top:8px'>"+(r.data||[]).length+" posts</div><p style='font-size:13px;color:#777'>"+esc(profile.bio||"Tell the world something about you.")+"</p></div></div><button class='secondary' onclick='edit()'>Edit profile</button><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:15px'>"+(r.data||[]).map(function(p){return "<div style='aspect-ratio:1;overflow:hidden;background:#eee'><img src='"+esc(p.media_url)+"' style='width:100%;height:100%;object-fit:cover'></div>"}).join("")+"</div></section>";side()}
function edit(){var n=prompt("Display name",profile.display_name),b=prompt("Bio",profile.bio);if(n===null||b===null)return;sb.from("social_profiles").update({display_name:n,bio:b}).eq("id",user.id).then(function(){ensureProfile().then(function(){profilePage();toast("Profile updated")})})}
async function logout(){await sb.auth.signOut()}
async function init(){if(!window.supabase||!window.supabase.createClient){document.getElementById("root").innerHTML="<main class=\"auth\"><section class=\"authcard\"><div class=\"brand\" style=\"text-align:center\"><span>Pulse</span></div><p class=\"sub\">The secure app library did not load. Tap Reload to try again.</p><button class=\"primary\" onclick=\"location.reload()\">Reload Pulse</button></section></main>";return}sb=window.supabase.createClient(URL,KEY);var r=await Promise.race([sb.auth.getSession(),new Promise(function(_,rej){setTimeout(function(){rej(new Error("Connection timeout"))},8000)})]).catch(function(e){return {data:{session:null},error:e}});if(r.error){renderAuth();toast("Connection is taking longer than expected");return}user=r.data.session&&r.data.session.user||null;if(user){await ensureProfile();home()}else renderAuth();sb.auth.onAuthStateChange(async function(e,s){user=s&&s.user||null;if(user){await ensureProfile();home()}else renderAuth()})}
init();
</script></body></html>
