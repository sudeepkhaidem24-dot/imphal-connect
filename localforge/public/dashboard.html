<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalForge Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">LOCAL<span>FORGE</span></a><a href="/">Home</a></header><main style="max-width:1050px;margin:auto;padding:60px 20px"><small>BUSINESS DASHBOARD</small><h1>Build your presence.</h1><div id="auth"><div class="prices" style="grid-template-columns:1fr;max-width:500px"><article><h2>Login</h2><form id="login" style="display:grid;gap:10px"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password" required><button class="btn">Login</button><p id="msg"></p></form><hr><h2>Create account</h2><form id="signup" style="display:grid;gap:10px"><input id="name" placeholder="Name" required><input id="se" type="email" placeholder="Email" required><input id="sp" type="password" minlength="8" placeholder="Password" required><button class="btn">Create account</button><p id="sm"></p></form></article></div></div><div id="app" hidden><div class="preview"><div><small>BUSINESS</small><b id="bn"></b></div><div><small>PUBLIC URL</small><b id="url"></b></div></div><article style="background:#fff;border:1px solid #dce4dd;border-radius:18px;padding:24px;margin-top:16px"><h2>Profile</h2><form id="profile" style="display:grid;gap:10px"><input id="bname" placeholder="Business name" required><textarea id="desc" placeholder="Description"></textarea><input id="phone" placeholder="Phone"><input id="wa" placeholder="WhatsApp"><input id="address" placeholder="Address"><input id="city" placeholder="City"><input id="maps" placeholder="Google Maps link"><input id="logo" placeholder="Logo image URL"><button class="btn">Save profile</button><p id="save"></p></form></article><article style="background:#fff;border:1px solid #dce4dd;border-radius:18px;padding:24px;margin-top:16px"><div style="display:flex;justify-content:space-between"><h2>Catalogue</h2><button id="add" class="btn small">Add item</button></div><div id="items"></div></article></div></main><script src="/dashboard.js"></script></body></html>
