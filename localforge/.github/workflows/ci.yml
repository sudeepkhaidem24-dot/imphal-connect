name: LocalForge CI
on:
  push:
    paths: ['localforge/**']
  pull_request:
    paths: ['localforge/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
