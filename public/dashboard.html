<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6b4d"><meta name="description" content="Imphal Connect business owner dashboard. Manage your local business profile, photos, products, services and membership.">
<title>Imphal Connect · Business Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--bg:#f7faf7;--card:#fff;--ink:#173a2c;--muted:#68766d;--green:#1e6b4d;--soft:#edf5ef;--line:#dfe7e0;--danger:#a84747;--gold:#b48a43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.wrap{max-width:1180px;margin:auto;padding:18px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:10px;align-items:center;font:800 18px Manrope}.mark{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:800;font-size:11px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:28px}.side{position:sticky;top:18px;height:max-content}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;color:var(--muted);font-weight:800;font-size:12px}.side button.active{background:var(--soft);color:var(--green)}main{min-width:0}.hero{background:#fff;border:1px solid var(--line);padding:24px;border-radius:22px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{font:800 30px Manrope;margin:5px 0}.eyebrow{font-size:9px;letter-spacing:1px;font-weight:900;color:var(--green)}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--green);font-size:9px;font-weight:900}.status.warn{background:#fff5e6;color:#9a681e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font:800 22px Manrope}.stat span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.panel{margin-top:12px}.panel h2{font:800 18px Manrope;margin:0 0 5px}.muted{font-size:10px;color:var(--muted);line-height:1.6}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:9px;font-weight:900;color:var(--muted)}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink)}textarea{min-height:110px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.product{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ed}.product:last-child{border-bottom:0}.product b{font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:11px}.pay{border:1px solid #d9e8dc;background:#f8fcf8;padding:18px;border-radius:16px}.pay strong{font:800 25px Manrope}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#173a2c;color:#fff;padding:11px 15px;border-radius:11px;font-size:10px;font-weight:800;display:none;z-index:20}.toast.show{display:block}.login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);padding:26px;border-radius:22px}.hidden{display:none!important}
@media(max-width:760px){.wrap{padding:14px 14px 40px}.layout{display:block}.side{position:static;display:flex;overflow:auto;gap:5px;margin-bottom:12px}.side button{white-space:nowrap;width:auto}.hero{padding:18px}.hero h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.actions{flex-wrap:wrap}.actions .btn{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="/"><span class="mark">IC</span><span>Imphal Connect<small style="display:block;color:var(--muted);font:700 8px DM Sans;letter-spacing:.8px">BUSINESS</small></span></a><div class="actions"><a class="btn" href="/">Open public app</a><button class="btn danger" id="signout">Sign out</button></div></header>
<section id="login" class="login hidden"><div class="eyebrow">BUSINESS OWNER ACCESS</div><h1 style="font:800 27px Manrope">Sign in to manage your business.</h1><p class="muted">Your customer experience stays separate from this workspace.</p><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px"><button class="btn primary" id="loginBtn" style="width:100%;margin-top:8px">Sign in</button><div id="loginMsg" class="muted" style="margin-top:8px"></div></section>
<section id="app" class="layout hidden">
<aside class="side"><button class="active" data-tab="overview">Overview</button><button data-tab="profile">Business Profile</button><button data-tab="products">Products & Services</button><button data-tab="photos">Photos</button><button data-tab="membership">Membership</button><button data-tab="settings">Settings</button></aside>
<main><section class="hero"><div><div class="eyebrow">BUSINESS OWNER WORKSPACE</div><h1 id="businessName">Your business</h1><p id="businessMeta" class="muted">Loading…</p></div><span id="businessStatus" class="status">Draft</span></section>
<div id="content"></div></main></section>
</div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb=null,token='',me=null,tab='overview',cfg=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json',Authorization:'Bearer '+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Something went wrong. Please try again.');return d}
async function init(){cfg=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(cfg.supabase.url,cfg.supabase.key);const s=(await sb.auth.getSession()).data.session;if(s){token=s.access_token;await load()}else{$('login').classList.remove('hidden')}}
async function load(){try{const d=await api('/api/me');me=d; if(!me.business){$('app').classList.remove('hidden');renderEmptyBusiness();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');header();render()}catch(e){$('login').classList.remove('hidden');$('loginMsg').textContent=e.message}}
function header(){const b=me.business;$('businessName').textContent=b.name;$('businessMeta').textContent=(b.category||'Local business')+' · '+(b.city||'Imphal');const status=b.status||(!b.is_published?'draft':'published');$('businessStatus').textContent=status.replace('_',' ');$('businessStatus').className='status '+(status==='pending_review'?'warn':'')}
function renderEmptyBusiness(){$('businessName').textContent='Create your business';$('businessMeta').textContent='Your public listing will remain unpublished until membership and review are complete.';$('content').innerHTML='<div class="panel"><h2>Start your listing</h2><p class="muted">Add the basics first. Then activate the ₹120/year Business Owner membership.</p><div class="field"><label>BUSINESS NAME</label><input id="newName" placeholder="e.g. Classic Cafe Imphal"></div><div class="field"><label>CATEGORY</label><select id="newCat"><option>Food & Dining</option><option>Shopping</option><option>Health</option><option>Beauty</option><option>Fitness</option><option>Hotels & Stay</option><option>Education</option><option>Automotive</option><option>Electronics</option><option>Home Services</option><option>Professional Services</option><option>Travel</option><option>Events & Weddings</option><option>Local Products</option><option>Repair Services</option><option>Other Services</option></select></div><button class="btn primary" id="createBtn" style="margin-top:12px">Create business profile</button></div>';$('createBtn').onclick=async()=>{try{const d=await api('/api/business',{method:'POST',body:JSON.stringify({name:$('newName').value.trim(),category:$('newCat').value,city:'Imphal'})});me.business=d.business;header();render();toast('Business profile saved')}catch(e){toast(e.message)}}}
function render(){if(!me.business)return renderEmptyBusiness();if(tab==='overview')overview();if(tab==='profile')profile();if(tab==='products')products();if(tab==='photos')photos();if(tab==='membership')membership();if(tab==='settings')settings()}
function overview(){const b=me.business;$('content').innerHTML='<div class="grid"><div class="stat"><b id="views">—</b><span>Profile views</span></div><div class="stat"><b id="calls">—</b><span>Calls</span></div><div class="stat"><b id="wa">—</b><span>WhatsApp clicks</span></div><div class="stat"><b id="dir">—</b><span>Directions</span></div></div><div class="panel"><h2>Next action</h2><p class="muted">'+(b.subscription_status==='active'?'Your membership is active. Complete your profile and submit it for review.':'Activate the ₹120/year Business Owner membership to unlock photos, products, services and publishing.')+'</p><div class="actions-row"><button class="btn primary" onclick="tab=\'profile\';render()">Edit profile</button><button class="btn" onclick="tab=\'membership\';render()">Membership</button><button class="btn" onclick="tab=\'products\';render()">Products & services</button></div></div>';loadInsights()}
async function loadInsights(){try{const d=await api('/api/analytics/owner');const m=d.metrics||{};['views','calls','wa','dir'].forEach((id,i)=>{const k=['profile_view','call','whatsapp','directions'][i];if($(id))$(id).textContent=m[k]||0})}catch{}}
function profile(){const b=me.business;const oh=b.opening_hours||{};$('content').innerHTML='<div class="panel"><h2>Business profile</h2><div class="two"><div class="field"><label>BUSINESS NAME</label><input id="name" value="'+esc(b.name)+'"></div><div class="field"><label>CATEGORY</label><input id="cat" value="'+esc(b.category||'Services')+'"></div></div><div class="field"><label>DESCRIPTION</label><textarea id="desc">'+esc(b.description||'')+'</textarea></div><div class="two"><div class="field"><label>PHONE</label><input id="phone" value="'+esc(b.phone||'')+'" inputmode="tel"></div><div class="field"><label>WHATSAPP</label><input id="waInput" value="'+esc(b.whatsapp||'')+'" inputmode="tel"></div></div><div class="field"><label>ADDRESS</label><input id="address" value="'+esc(b.address||'')"></div><div class="two"><div class="field"><label>WEBSITE</label><input id="web" value="'+esc(b.website||'')"></div><div class="field"><label>INSTAGRAM</label><input id="ig" value="'+esc(b.instagram_url||'')"></div></div><div class="actions-row"><button class="btn primary" id="saveProfile">Save profile</button><button class="btn" id="submitReview">Submit for review</button></div><p id="profileMsg" class="muted"></p></div>'; $('saveProfile').onclick=saveProfile;$('submitReview').onclick=submitReview}
async function saveProfile(){try{await api('/api/business',{method:'PATCH',body:JSON.stringify({name:$('name').value.trim(),category:$('cat').value.trim(),description:$('desc').value.trim(),phone:$('phone').value.trim(),whatsapp:$('waInput').value.trim(),address:$('address').value.trim(),website:$('web').value.trim(),instagram_url:$('ig').value.trim()})});await load();toast('Profile saved')}catch(e){$('profileMsg').textContent=e.message}}
async function submitReview(){try{const d=await api('/api/business',{method:'PATCH',body:JSON.stringify({is_published:true})});me.business=d.business;header();toast('Submitted for admin review')}catch(e){$('profileMsg').textContent=e.message}}
async function products(){const d=await api('/api/businesses/'+encodeURIComponent(me.business.slug));const items=d.items||[];$('content').innerHTML='<div class="panel"><h2>Products & Services</h2><p class="muted">Add real offerings and prices. These appear on your public profile.</p><div class="two"><div class="field"><label>NAME</label><input id="pn" placeholder="Chicken Thali"></div><div class="field"><label>PRICE</label><input id="pp" type="number" min="0" step=".01" placeholder="180"></div></div><div class="field"><label>DESCRIPTION</label><textarea id="pd" placeholder="Short, useful description"></textarea></div><button class="btn primary" id="addProduct">Add product/service</button><div style="margin-top:18px">'+(items.length?items.map(x=>'<div class="product"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.description||'')+'</div></div><b>'+(x.price==null?'Ask':'₹'+Number(x.price).toLocaleString('en-IN'))+'</b></div>').join(''):'<div class="empty">No products or services yet.</div>')+'</div></div>';$('addProduct').onclick=async()=>{try{await api('/api/items',{method:'POST',body:JSON.stringify({name:$('pn').value.trim(),price:$('pp').value||null,description:$('pd').value.trim()})});toast('Added');products()}catch(e){toast(e.message)}}
function photos(){const b=me.business;$('content').innerHTML='<div class="panel"><h2>Photos</h2><p class="muted">Use JPG, PNG or WebP under 5 MB. Images are stored in your business media bucket.</p><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions-row"><button class="btn primary" id="upload">Upload photo</button></div><div style="margin-top:16px" id="photoList">'+(b.gallery_urls||[]).map(u=>'<img src="'+esc(u)+'" alt="" loading="lazy" style="width:110px;height:85px;object-fit:cover;border-radius:10px;margin:0 7px 7px 0">').join('')+'</div></div>';$('upload').onclick=uploadPhoto}
async function uploadPhoto(){const f=$('photo').files?.[0];if(!f)return toast('Choose an image');if(f.size>5*1024*1024)return toast('Image must be under 5 MB');try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const s=await api('/api/upload/sign',{method:'POST',body:JSON.stringify({extension:ext})});const up=await sb.storage.from('business-media').uploadToSignedUrl(s.path,s.token,f);if(up.error)throw up.error;const urls=[...(me.business.gallery_urls||[]),s.publicBase].slice(0,12);const d=await api('/api/business',{method:'PATCH',body:JSON.stringify({gallery_urls:urls,cover_url:me.business.cover_url||s.publicBase})});me.business=d.business;photos();toast('Photo uploaded')}catch(e){toast(e.message)}}
function membership(){const b=me.business,active=b.subscription_status==='active'&&['owner','pro','elite'].includes(b.plan);$('content').innerHTML='<div class="panel"><h2>Business Owner membership</h2><p class="muted">One annual payment. No ₹10 monthly recurring charge.</p><div class="pay"><div class="eyebrow">LAUNCH MEMBERSHIP</div><strong>₹120 <span style="font:500 11px DM Sans;color:var(--muted)">/ year</span></strong><p class="muted">Unlock owner tools, photos, products, services, pricing and submission for publication.</p><button class="btn primary" id="payBtn" '+(active?'disabled':'')+'>'+(active?'Membership active':'Pay ₹120/year')+'</button><p id="payMsg" class="muted"></p></div></div>';if(!active)$('payBtn').onclick=pay}
async function pay(){try{const buttonId=cfg.uropay.ownerButtonId||cfg.uropay.proButtonId;if(!cfg.uropay.apiKey||!buttonId)throw Error('UPI checkout is not configured yet.');const d=await api('/api/payments/uropay/intents',{method:'POST',body:JSON.stringify({plan:'owner'})});const a=document.createElement('a');a.href='#';a.className='uropay-btn';a.textContent='Pay ₹120 with UPI';a.dataset.uropayApiKey=cfg.uropay.apiKey;a.dataset.uropayButtonId=buttonId;a.dataset.uropayEnvironment=cfg.uropay.environment||'LIVE';a.dataset.uropayAmount='120';document.body.appendChild(a);const sc=document.createElement('script');sc.src='https://cdn.uropay.me/uropay-embed.min.js';sc.async=true;sc.onload=()=>{a.click()};document.body.appendChild(sc);$('payMsg').textContent='Complete the UPI payment, then enter the reference in the payment prompt.';window.__ownerIntent=d.intent}catch(e){$('payMsg').textContent=e.message}}
function settings(){$('content').innerHTML='<div class="panel"><h2>Settings</h2><p class="muted">Account: '+esc(me.user?.email||'')+'</p><p class="muted">Business ID: '+esc(me.business?.id||'—')+'</p><p class="muted">Membership status: '+esc(me.business?.subscription_status||'inactive')+'</p></div>'}
document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
$('loginBtn').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}token=data.session.access_token;await load()};
$('signout').onclick=async()=>{if(sb)await sb.auth.signOut();location.href='/'};
init();
</script>
</body></html>
