<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103f32">
<meta name="description" content="Imphal Connect — discover local businesses, products and services around Imphal.">
<meta property="og:title" content="Imphal Connect — Discover Imphal">
<meta property="og:description" content="Find local businesses, products and services around Imphal.">
<link rel="manifest" href="/manifest.json">
<title>Imphal Connect — Discover Imphal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--green:#103f32;--emerald:#17634e;--gold:#b58a45;--ink:#16231e;--muted:#68756f;--paper:#f7f5ef;--card:#fff;--line:#e2e5df;--soft:#eef3ed;--shadow:0 18px 55px rgba(16,63,50,.09);--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.wrap{max-width:1240px;margin:auto;padding:0 20px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font:800 18px Manrope}.mark{width:40px;height:40px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font:800 13px Manrope;box-shadow:0 9px 24px #103f3228}.navlinks{display:flex;align-items:center;gap:22px;font-size:12px;color:var(--muted);font-weight:700}.navlinks a:hover{color:var(--green)}.owner{padding:11px 15px;border-radius:12px;background:var(--green);color:#fff!important}.hero{padding:55px 0 42px;display:grid;grid-template-columns:1.15fr .85fr;gap:46px;align-items:center}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--emerald)}h1{font:800 clamp(48px,7vw,82px)/.93 Manrope;letter-spacing:-4px;margin:14px 0 18px;color:var(--green)}.hero p{font-size:17px;line-height:1.65;color:var(--muted);max-width:650px}.search{display:flex;gap:8px;margin-top:28px;background:#fff;border:1px solid var(--line);padding:7px;border-radius:17px;box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;padding:12px 14px;background:transparent}.search button,.primary{border:0;background:var(--green);color:#fff;border-radius:13px;padding:13px 18px;font-weight:800}.hero-card{min-height:410px;border-radius:34px;background:linear-gradient(145deg,#dbe8de,#f7f5ef 55%,#eadfc9);padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero-card:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;background:#17634e14;right:-100px;bottom:-90px}.hero-card .quote{position:absolute;left:28px;right:28px;bottom:28px;background:#ffffffd9;backdrop-filter:blur(15px);border:1px solid #fff;border-radius:20px;padding:18px}.quote b{display:block;font:800 19px Manrope;color:var(--green)}.quote span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.section{padding:48px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.section-head h2{font:800 30px Manrope;letter-spacing:-1px;margin:0;color:var(--green)}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.textlink{color:var(--emerald);font-weight:800;font-size:12px}.chips{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:700;color:#425149}.chip:hover,.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 10px 35px rgba(16,63,50,.055);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{height:175px;background:linear-gradient(135deg,#dce8df,#f0eadc);display:grid;place-items:center;color:#809087;font-weight:700;font-size:11px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{font:800 17px Manrope;margin:0 0 6px}.meta{font-size:11px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:7px;margin-top:12px}.small{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800}.empty{padding:35px;text-align:center;border:1px dashed #cbd4cd;border-radius:20px;color:var(--muted);background:#fbfaf6}.feature{display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;background:var(--green);color:#fff;min-height:300px}.feature-copy{padding:38px}.feature h2{font:800 36px Manrope;margin:9px 0 12px}.feature p{color:#d4e2db;line-height:1.65;font-size:13px}.feature-art{background:linear-gradient(135deg,#285f4d,#d1b889);min-height:250px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.num{color:var(--gold);font:800 12px Manrope}.step h3{font:800 18px Manrope;color:var(--green)}.step p{font-size:12px;line-height:1.6;color:var(--muted)}.pricing{display:grid;grid-template-columns:minmax(0,620px);justify-content:center}.plan{background:#fff;border:1px solid #cfd8d0;border-radius:28px;padding:30px;box-shadow:var(--shadow)}.plan h3{font:800 23px Manrope;color:var(--green);margin:0}.price{font:800 50px Manrope;color:var(--green);margin:8px 0}.price span{font:500 12px DM Sans;color:var(--muted)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.checks div{font-size:12px;color:#526058}.checks b{color:var(--emerald)}footer{border-top:1px solid var(--line);padding:30px 0 45px;color:var(--muted);font-size:11px}.footerrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.profile{padding:28px 0 60px}.profile-hero{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.profile h1{font-size:46px;letter-spacing:-2px;margin:8px 0}.profile-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:20px;margin-top:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.panel h2{font:800 22px Manrope;color:var(--green);margin:0 0 12px}.item{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.muted{color:var(--muted)}.back{color:var(--emerald);font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:#0d2119aa;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.sheet{width:min(440px,100%);background:#fff;border-radius:25px;padding:25px;box-shadow:0 30px 90px #071c1450}.sheet h2{font:800 24px Manrope;color:var(--green);margin:0 0 8px}.field{margin:12px 0}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}.close{float:right;border:0;background:var(--soft);border-radius:10px;padding:8px}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}.hidden{display:none!important}@media(max-width:850px){.navlinks a:not(.owner){display:none}.hero{grid-template-columns:1fr;padding-top:35px}.hero-card{min-height:250px}.grid{grid-template-columns:repeat(2,1fr)}.feature{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:0 15px}.nav{height:66px}.hero h1{font-size:49px;letter-spacing:-3px}.hero p{font-size:15px}.search button{padding:12px}.grid{grid-template-columns:1fr}.photo{height:190px}.checks{grid-template-columns:1fr}.section{padding:38px 0}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav">
<a class="brand" href="/"><span class="mark">IC</span><span>Imphal Connect</span></a>
<div class="navlinks"><a href="/explore">Explore</a><a href="/categories">Categories</a><a href="/saved">Saved</a><a href="/account">Account</a><a class="owner" href="/dashboard.html">List Your Business · ₹120/year</a></div>
</nav>
<main id="app"></main>
<footer><div class="footerrow"><span><b style="color:var(--green)">Imphal Connect</b> · Discover local businesses around Imphal.</span><span><a href="/about.html">About</a> · <a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span></div></footer>
</div>
<div class="modal" id="auth"><div class="sheet"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle">Welcome back</h2><p class="muted" style="font-size:12px">Sign in to save businesses and manage your account.</p><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="authAction()">Sign in</button><button class="small" style="width:100%;margin-top:9px" onclick="toggleAuth()">Create an account</button><div id="authMsg" class="notice"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CATS=['Restaurants','Cafés','Hotels','Salons','Gyms','Clinics','Pharmacies','Tutors','Repair Shops','Fashion','Groceries','Services','Electronics','Handloom'];
let sb=null,authMode='login',saved=JSON.parse(localStorage.getItem('ic_saved')||'[]');
async function initAuthClient(){try{const r=await fetch('/api/config',{cache:'no-store'});const cfg=await r.json();if(cfg?.supabase?.url&&cfg?.supabase?.key&&window.supabase)sb=window.supabase.createClient(cfg.supabase.url,cfg.supabase.key);window.icSupabase=sb;return sb}catch(e){console.warn('Optional auth initialization failed:',e);window.icSupabase=null;return null}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('ic_saved',JSON.stringify(saved));render()}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Something went wrong');return d}
function card(b){return '<article class="card"><a href="/business/'+encodeURIComponent(b.slug)+'"><div class="photo">'+(b.cover_url?'<img loading="lazy" src="'+esc(b.cover_url)+'" alt="">':'<span>IMPHAL CONNECT</span>')+'</div></a><div class="body"><h3>'+esc(b.name)+'</h3><div class="meta">'+esc(b.category||'Local business')+' · '+esc(b.city||'Imphal')+'</div><div class="meta">'+esc(b.address||'Imphal, Manipur')+'</div><div class="actions"><a class="small" href="/business/'+encodeURIComponent(b.slug)+'">View</a><button class="small" onclick="event.preventDefault();save(\''+esc(b.id)+'\')">'+(saved.includes(b.id)?'Saved':'Save')+'</button></div></div></article>'}
async function directory(q='',category=''){let url='/api/businesses?';if(q)url+='q='+encodeURIComponent(q)+'&';if(category)url+='category='+encodeURIComponent(category);const d=await api(url);return d.businesses||[]}
async function home(){const app=$('app');app.innerHTML='<section class="hero"><div><div class="eyebrow">LOCAL DISCOVERY · IMPHAL, MANIPUR</div><h1>Discover Imphal.</h1><p>Find local businesses, products and services around you — in one simple place.</p><form class="search" onsubmit="event.preventDefault();location.href=\'/explore?q=\'+encodeURIComponent(this.q.value)"><input name="q" placeholder="Search restaurants, salons, shops, services…"><button>Search</button></form></div><div class="hero-card"><div class="eyebrow">IMPHAL CONNECT</div><div class="quote"><b>Local is closer.</b><span>Discover a business. Connect directly. Get where you need to go.</span></div></div></section><section class="section"><div class="section-head"><div><h2>Explore categories</h2><p>Find what you need around Imphal.</p></div><a class="textlink" href="/categories">See all</a></div><div class="chips">'+CATS.slice(0,9).map(c=>'<a class="chip" href="/explore?category='+encodeURIComponent(c)+'">'+c+'</a>').join('')+'</div></section><section class="section"><div class="section-head"><div><h2>Discover local</h2><p>Published businesses on Imphal Connect.</p></div><a class="textlink" href="/explore">Explore all</a></div><div id="homeGrid" class="grid"><div class="empty">Loading local businesses…</div></div></section><section class="section"><div class="feature"><div class="feature-copy"><div class="eyebrow" style="color:#d7c29a">FOR BUSINESS OWNERS</div><h2>Put your business on Imphal Connect.</h2><p>One simple annual membership. Create your profile, add photos, products, services, prices and contact information.</p><a class="primary" href="/dashboard.html">List Your Business · ₹120/year</a></div><div class="feature-art"></div></div></section><section class="section"><div class="section-head"><div><h2>How it works</h2><p>Simple for customers. Simple for businesses.</p></div></div><div class="steps"><div class="step"><span class="num">01</span><h3>Search</h3><p>Find businesses, categories, products and services around Imphal.</p></div><div class="step"><span class="num">02</span><h3>Discover</h3><p>View real business information, photos, prices, hours and location.</p></div><div class="step"><span class="num">03</span><h3>Connect</h3><p>Call, WhatsApp, share or get directions directly.</p></div></div></section><section class="section"><div class="section-head"><div><h2>One plan for businesses.</h2><p>No tiers. No monthly subscription.</p></div></div><div class="pricing"><div class="plan"><h3>Imphal Connect Business</h3><div class="price">₹120 <span>/ YEAR</span></div><div class="muted" style="font-size:13px">Everything you need to put your business online on Imphal Connect.</div><div class="checks"><div><b>✓</b> Business profile</div><div><b>✓</b> Photos</div><div><b>✓</b> Products & services</div><div><b>✓</b> Prices</div><div><b>✓</b> Contact information</div><div><b>✓</b> WhatsApp</div><div><b>✓</b> Google Maps</div><div><b>✓</b> Opening hours</div><div><b>✓</b> Business description</div><div><b>✓</b> Profile management</div></div><a class="primary" href="/dashboard.html">GET STARTED</a></div></div></section>';
try{const bs=await directory();$('homeGrid').innerHTML=bs.length?bs.slice(0,8).map(card).join(''):'<div class="empty" style="grid-column:1/-1">No published businesses yet. Be one of the first to list your business.</div>'}catch(e){console.error('Business discovery:',e);const grid=$('homeGrid');if(grid)grid.innerHTML='<div class="empty" style="grid-column:1/-1">We could not load businesses right now. Please try again.</div>'}}
async function explore(){const p=new URLSearchParams(location.search),q=p.get('q')||'',cat=p.get('category')||'';$('app').innerHTML='<section class="section"><div class="section-head"><div><div class="eyebrow">EXPLORE</div><h2 style="margin-top:8px">Businesses around Imphal</h2><p>Search by business name, category or keyword.</p></div></div><form class="search" onsubmit="event.preventDefault();location.search='?q='+encodeURIComponent(this.q.value)"><input name="q" value="'+esc(q)+'" placeholder="Search Imphal businesses…"><button>Search</button></form><div class="chips" style="margin-top:16px">'+CATS.map(c=>'<a class="chip '+(cat===c?'active':'')+'" href="?category='+encodeURIComponent(c)+'">'+c+'</a>').join('')+'</div><div id="results" class="grid" style="margin-top:24px"><div class="empty" style="grid-column:1/-1">Searching…</div></div></section>';try{const bs=await directory(q,cat);$('results').innerHTML=bs.length?bs.map(card).join(''):'<div class="empty" style="grid-column:1/-1"><b>No businesses found.</b><br>Try a different search or category.</div>'}catch(e){$('results').innerHTML='<div class="empty" style="grid-column:1/-1">We could not connect. Please try again.</div>'}}
async function profile(slug){try{const d=await api('/api/businesses/'+encodeURIComponent(slug)),b=d.business,items=d.items||[];$('app').innerHTML='<section class="profile"><a class="back" href="/explore">← Back to Explore</a><div class="profile-hero" style="margin-top:15px"><div class="eyebrow">'+esc(b.category||'Local business')+'</div><h1>'+esc(b.name)+'</h1><p class="muted">'+esc(b.description||'Local business in Imphal.')+'</p><div class="actions"><a class="primary" href="tel:'+esc(b.phone||'')+'">Call</a>'+(b.whatsapp?'<a class="small" target="_blank" href="https://wa.me/'+encodeURIComponent(b.whatsapp.replace(/\D/g,''))+'">WhatsApp</a>':'')+(b.latitude&&b.longitude?'<a class="small" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+b.latitude+','+b.longitude+'">Directions</a>':(b.address?'<a class="small" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.address+', Imphal')+'">Directions</a>':''))+'<button class="small" onclick="save(\''+esc(b.id)+'\')">'+(saved.includes(b.id)?'Saved':'Save')+'</button></div></div><div class="profile-grid"><div class="panel"><h2>Products & services</h2>'+(items.length?items.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><div class="muted" style="font-size:12px">'+esc(x.description||'')+'</div></div><b style="color:var(--emerald)">'+(x.price==null?'Ask':'₹'+Number(x.price).toLocaleString('en-IN'))+'</b></div>').join(''):'<div class="empty">No products or services published yet.</div>')+'</div><div><div class="panel"><h2>Contact</h2><p class="muted">'+esc(b.address||'Imphal, Manipur')+'</p><p class="muted">'+esc(b.phone||'Phone not provided')+'</p></div><div class="panel" style="margin-top:15px"><h2>Opening hours</h2><pre style="white-space:pre-wrap;font:12px DM Sans;color:var(--muted)">'+esc(JSON.stringify(b.opening_hours||{},null,2).replace(/[{}\"]/g,''))+'</pre></div></div></div></section>'}catch(e){$('app').innerHTML='<section class="section"><div class="empty"><b>Business not found.</b><br>This profile may have been removed or is not published.</div></section>'}}
function categories(){ $('app').innerHTML='<section class="section"><div class="eyebrow">CATEGORIES</div><h1 style="font-size:54px;letter-spacing:-3px">Find your local.</h1><div class="chips" style="flex-wrap:wrap;margin-top:25px">'+CATS.map(c=>'<a class="chip" href="/explore?category='+encodeURIComponent(c)+'">'+c+'</a>').join('')+'</div></section>'}
function savedPage(){const ids=new Set(saved);$('app').innerHTML='<section class="section"><div class="eyebrow">SAVED</div><h2 style="font:800 34px Manrope;color:var(--green);margin:10px 0">Your saved businesses</h2><div id="savedGrid" class="grid"></div></section>';directory().then(bs=>{const x=bs.filter(b=>ids.has(b.id));$('savedGrid').innerHTML=x.length?x.map(card).join(''):'<div class="empty" style="grid-column:1/-1">You have not saved any published businesses yet.</div>'}).catch(()=>{})}
async function account(){let session=null;try{if(!sb)await initAuthClient();session=sb?(await sb.auth.getSession()).data.session:null}catch{}$('app').innerHTML='<section class="section"><div class="eyebrow">ACCOUNT</div><h2 style="font:800 34px Manrope;color:var(--green);margin:10px 0">'+(session?'Your account':'Welcome to Imphal Connect')+'</h2><p class="muted">'+(session?'Signed in as '+esc(session.user.email):'Sign in to save businesses and manage your account.')+'</p>'+(session?'<button class="primary" onclick="signOut()">Sign out</button>':'<button class="primary" onclick="openAuth()">Sign in</button>')+'</section>'}
async function authAction(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('authMsg').textContent='Enter your email and password.';if(!sb)await initAuthClient();if(!sb)return $('authMsg').textContent='Sign-in is temporarily unavailable. You can still browse Imphal Connect.';let r;if(authMode==='login')r=await sb.auth.signInWithPassword({email,password});else r=await sb.auth.signUp({email,password});if(r.error)return $('authMsg').textContent=r.error.message;closeAuth();location.reload()}
function toggleAuth(){authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Welcome back':'Create your account';document.querySelector('#auth .primary').textContent=authMode==='login'?'Sign in':'Create account';document.querySelector('#auth .small').textContent=authMode==='login'?'Create an account':'Already have an account? Sign in'}
function openAuth(){ $('auth').classList.add('open') }function closeAuth(){$('auth').classList.remove('open')}
async function signOut(){if(sb)await sb.auth.signOut();location.reload()}
async function init(){const path=location.pathname.replace(/\/$/,'');try{initAuthClient().catch(()=>{});if(path==='/explore')return await explore();if(path==='/categories')return categories();if(path==='/saved')return savedPage();if(path==='/account')return account();if(path.startsWith('/business/'))return await profile(decodeURIComponent(path.split('/')[2]||''));return await home()}catch(error){console.error('Imphal Connect render error:',error);renderFatalState(error)}}
function renderFatalState(error){const app=document.getElementById('app');if(!app)return;app.innerHTML='<section class="section"><div class="empty"><h2 style="color:var(--green)">Imphal Connect is loading</h2><p>Please refresh the page.</p><button class="primary" onclick="location.reload()">Refresh</button></div></section>';console.error(error)}
init();
</script>
</body>
</html>
