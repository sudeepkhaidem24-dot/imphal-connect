<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Imphal Connect — Business</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#111;font:13px system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1080px,calc(100% - 24px));margin:auto}.top{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.4px}.btn{border:1px solid #ccc;background:#fff;padding:9px 12px;border-radius:10px;font-size:10px;font-weight:800}.hero{min-height:390px;background:#111;color:#fff;border-radius:24px;overflow:hidden;position:relative;padding:38px;display:flex;align-items:end}.cover{position:absolute;inset:0;background:#222 center/cover no-repeat;filter:grayscale(100%);opacity:.58}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#050505,transparent 75%)}.hero>*{position:relative;z-index:2}.hero h1{font-size:54px;line-height:.95;letter-spacing:-3px;margin:9px 0}.ey{font-size:8px;letter-spacing:2px;color:#aaa;font-weight:900}.meta{color:#bbb;font-size:11px}.actions{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}.action{background:#fff;color:#111;border:0;padding:10px 15px;border-radius:12px;font-size:10px;font-weight:900}.action.dark{background:#111;color:#fff;border:1px solid #555}.section{padding:25px 0}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px}.card h2{font-size:20px;margin:0 0 6px}.muted{color:#777;font-size:10px;line-height:1.6}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{border:1px solid #e0e0dd;border-radius:14px;padding:14px}.item b{font-size:11px}.price{font-weight:900;margin-top:6px}.storyrail{display:flex;gap:8px;overflow:auto}.story{min-width:180px;height:120px;border-radius:14px;background:#ddd center/cover;filter:grayscale(100%);padding:10px;color:#fff;display:flex;align-items:end;font-weight:800}.offer{border:1px solid #ccc;padding:13px;border-radius:13px;margin-top:7px}.review{border-top:1px solid #eee;padding:12px 0}.stars{letter-spacing:2px}.form input,.form textarea{width:100%;border:1px solid #ccc;border-radius:10px;padding:10px;margin:5px 0 8px;font:inherit;font-size:11px}.form textarea{min-height:90px}.footer{border-top:1px solid #ddd;padding:25px 0 45px;color:#777;font-size:9px}@media(max-width:700px){.hero{min-height:420px;padding:25px}.hero h1{font-size:43px}.grid{grid-template-columns:1fr}.items{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/">IMPHAL CONNECT</a><a class="btn" href="/business.html">For Business</a></header><main id="app"><div class="card">Loading business…</div></main><footer class="footer">© 2026 Imphal Connect · Imphal, Manipur</footer></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
async function load(){if(!slug){location.href='/';return}const r=await fetch('/api/businesses/'+encodeURIComponent(slug));if(!r.ok){$('app').innerHTML='<div class="card"><h2>Business not found</h2><p class="muted">This listing may be unpublished or no longer available.</p></div>';return}const d=await r.json(),b=d.business,items=d.items||[],stories=d.stories||[],offers=d.offers||[],reviews=d.reviews||[];document.title=b.name+' — Imphal Connect';$('app').innerHTML=
'<section class="hero"><div class="cover" style="background-image:url('+JSON.stringify(b.cover_url||b.logo_url||'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1400&q=80')+')"></div><div class="shade"></div><div><div class="ey">'+esc(b.category||'LOCAL BUSINESS')+' · '+esc(b.city||'IMPHAL')+'</div><h1>'+esc(b.name)+'</h1><div class="meta">'+esc(b.address||'Imphal, Manipur')+'</div><p class="meta" style="max-width:620px;margin-top:10px">'+esc(b.description||'')+'</p><div class="actions">'+(b.phone?'<a class="action" href="tel:'+encodeURIComponent(b.phone)+'" onclick="track(\\'call\\')">Call</a>':'')+(b.whatsapp?'<a class="action" href="https://wa.me/'+String(b.whatsapp).replace(/\\D/g,'')+'" onclick="track(\\'whatsapp\\')">WhatsApp</a>':'')+'<button class="action dark" onclick="document.getElementById(\\'enquiry\\').scrollIntoView()">Enquire</button></div></div></section>'+
'<section class="section"><div class="grid"><div class="card"><h2>Products & services</h2><p class="muted">What this business offers.</p><div class="items">'+(items.length?items.map(x=>'<div class="item" onclick="track(\\'product_view\\')"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.description||'')+'</div><div class="price">'+(x.price==null?'Contact for price':'₹'+Number(x.price).toLocaleString('en-IN'))+'</div></div>').join(''):'<div class="muted">No catalogue published yet.</div>')+'</div></div><div><div class="card"><h2>Offers</h2>'+(offers.length?offers.map(x=>'<div class="offer"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.discount_text||'')+' · '+esc(x.description||'')+'</div></div>').join(''):'<p class="muted">No active offers.</p>')+'</div></div></div></section>'+
(stories.length?'<section class="section"><div class="card"><h2>Stories</h2><div class="storyrail">'+stories.map(x=>'<div class="story" style="background-image:linear-gradient(#0000,#000b),url('+JSON.stringify(x.image_url||b.cover_url||'')+')">'+esc(x.title||'Story')+'</div>').join('')+'</div></div></section>':'')+
'<section class="section" id="enquiry"><div class="grid"><div class="card"><h2>Send an enquiry</h2><p class="muted">Ask the business a question. They will receive it in their control room.</p><form class="form" onsubmit="sendEnquiry(event)"><input id="cn" required placeholder="Your name"><input id="cp" placeholder="Phone"><input id="ce" type="email" placeholder="Email"><textarea id="cm" required placeholder="What would you like to ask?"></textarea><button class="action" style="background:#111;color:#fff">Send enquiry</button><div id="em" class="muted" style="margin-top:8px"></div></form></div><div class="card"><h2>Reviews</h2>'+(reviews.length?reviews.map(x=>'<div class="review"><div class="stars">★★★★★</div><b>'+Number(x.rating)+'/5</b><p class="muted">'+esc(x.body)+'</p></div>').join(''):'<p class="muted">No reviews yet.</p>')+'</div></div></section>';
await fetch('/api/analytics/event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({business_id:b.id,event_type:'view'})})}
async function track(event){await fetch('/api/analytics/event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({business_id:window.businessId,event_type:event})})}
async function sendEnquiry(e){e.preventDefault();$('em').textContent='Sending…';try{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({business_id:window.businessId,customer_name:$('cn').value,customer_phone:$('cp').value,customer_email:$('ce').value,message:$('cm').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not send');$('em').textContent='Enquiry sent successfully.';e.target.reset()}catch(x){$('em').textContent=x.message}}
const oldLoad=load;window.businessId=null;
(async()=>{if(!slug)return load();const r=await fetch('/api/businesses/'+encodeURIComponent(slug));if(r.ok){const d=await r.json();window.businessId=d.business.id}return load()})();
</script></body></html>
